services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: openvoice
    volumes:
      - openvoice_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  openvoice:
    build: .
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      DATABASE_URL: mongodb://mongodb:27017/
      DATABASE_NAME: openvoice
      OPENVOICE_AGENT_MODEL: ${OPENVOICE_AGENT_MODEL:-gpt-4o-mini}
      OPENVOICE_AGENT_PROVIDER: ${OPENVOICE_AGENT_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ASR_MODEL_PATH: ${ASR_MODEL_PATH}
      ASR_BACKEND: ${ASR_BACKEND:-transformers}
    ports:
      - "8000:8000"
      - "5173:5173"
    gpus: all

volumes:
  openvoice_mongodb:
